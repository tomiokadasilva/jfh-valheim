services:
  valheim:
    image: ${VALHEIM_IMAGE}
    container_name: valheim

    cap_add:
      - SYS_NICE

    stop_grace_period: 2m

    ports:
      - "2456-2458:2456-2458/udp"

    volumes:
      - /srv/valheim/config:/config
      - /srv/valheim/data:/opt/valheim

    environment:
      SERVER_NAME: "Ja fui hardcore"
      WORLD_NAME: "DEEPNORTH"
      SERVER_PASS: "${SERVER_PASS}"

      SERVER_PORT: "2456"
      SERVER_PUBLIC: "false"

      BEPINEX: "true"
      VALHEIM_PLUS: "false"

      BACKUPS: "true"
      BACKUPS_CRON: "0 */6 * * *"
      BACKUPS_MAX_AGE: "7"

      TZ: "America/Sao_Paulo"

    restart: unless-stopped
