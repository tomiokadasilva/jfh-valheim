services:
  valheim:
    image: ${VALHEIM_IMAGE}
    container_name: valheim

    cap_add:
      - sys_nice

    stop_grace_period: 2m

    ports:
      - "2456-2457:2456-2457/udp"

    volumes:
      # Configurações e plugins BepInEx (ex.: NoRainDamage, PlantEverything,
      # AchievementEnablerPlus, AzuCraftyBoxes) ficam em /config/bepinex/plugins.
      - /srv/valheim/config:/config
      # Dados do mundo (DEEPNORTH).
      - /srv/valheim/data:/opt/valheim

    environment:
      SERVER_NAME: "Ja fui hardcore"
      WORLD_NAME: "DEEPNORTH"
      SERVER_PASS: ${SERVER_PASS}

      SERVER_PORT: 2456
      SERVER_PUBLIC: "false"

      # Obrigatório para que os plugins copiados pelo bootstrap sejam carregados.
      BEPINEX: "true"

      BACKUPS: "true"
      BACKUPS_CRON: "0 */6 * * *"
      BACKUPS_MAX_AGE: 7

      TZ: America/Sao_Paulo

    restart: unless-stopped