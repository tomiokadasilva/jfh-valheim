services:
  valheim-mods:
    image: alpine:3.20
    container_name: valheim-mods
    volumes:
      - valheim-config:/config
    environment:
      MODS: >-
        Azumatt/AzuCraftyBoxes/1.8.15
        Advize/PlantEverything/1.20.0
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache curl unzip >/dev/null
        PLUGINS=/config/bepinex/plugins
        STAMP=/config/bepinex/.installed-mods
        mkdir -p "$$PLUGINS"; touch "$$STAMP"
        for MOD in $$MODS; do
          OWNER=$${MOD%%/*}; REST=$${MOD#*/}; NAME=$${REST%%/*}; VER=$${REST#*/}
          TAG="$$OWNER-$$NAME-$$VER"
          if grep -qx "$$TAG" "$$STAMP"; then echo "[mods] $$TAG ok"; continue; fi
          echo "[mods] baixando $$TAG"
          rm -rf /tmp/$$NAME; mkdir -p /tmp/$$NAME
          curl -fsSL -o /tmp/$$NAME.zip "https://thunderstore.io/package/download/$$OWNER/$$NAME/$$VER/"
          unzip -oq /tmp/$$NAME.zip -d /tmp/$$NAME
          sed -i "/^$$OWNER-$$NAME-/d" "$$STAMP"
          rm -rf "$$PLUGINS/$$NAME"; mkdir -p "$$PLUGINS/$$NAME"
          if [ -d /tmp/$$NAME/plugins ]; then
            cp -a /tmp/$$NAME/plugins/. "$$PLUGINS/$$NAME/"
          elif [ -d /tmp/$$NAME/BepInEx/plugins ]; then
            cp -a /tmp/$$NAME/BepInEx/plugins/. "$$PLUGINS/$$NAME/"
          else
            find /tmp/$$NAME -maxdepth 1 -name '*.dll' -exec cp -a {} "$$PLUGINS/$$NAME/" \;
            for d in /tmp/$$NAME/*/; do [ -d "$$d" ] && cp -a "$$d" "$$PLUGINS/$$NAME/"; done
          fi
          find "$$PLUGINS/$$NAME" -name '*.dll' | grep -q . || { echo "[mods] ERRO: sem DLL em $$TAG" >&2; exit 1; }
          echo "$$TAG" >> "$$STAMP"
        done
        rm -rf /tmp/*.zip
        echo "[mods] pronto"; cat "$$STAMP"
    restart: "no"

  valheim:
    image: ghcr.io/lloesche/valheim-server
    container_name: valheim
    depends_on:
      valheim-mods:
        condition: service_completed_successfully
    cap_add:
      - sys_nice
    stop_grace_period: 2m
    ports:
      - "2456-2457:2456-2457/udp"
    volumes:
      - valheim-config:/config
      - valheim-data:/opt/valheim
    environment:
      SERVER_NAME: Ja fui hardcore
      WORLD_NAME: DEEPNORTH
      SERVER_PASS: bike123
      SERVER_PORT: 2456
      SERVER_PUBLIC: "false"
      BEPINEX: "true"
      BACKUPS: "true"
      BACKUPS_CRON: 0 */6 * * *
      BACKUPS_MAX_AGE: 7
      TZ: America/Sao_Paulo
    restart: unless-stopped

volumes:
  valheim-data:
  valheim-config: