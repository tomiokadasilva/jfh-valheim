name: Build and Push Valheim

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    environment: magalu-vm

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar tags
        id: tags
        run: |
          IMAGE="${{ vars.CR_ENDPOINT }}/${{ vars.CR_REGISTRY_NAME }}/valheim"
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DATE=$(date -u +%Y%m%d)
          VERSION_TAG="${DATE}-${SHA_SHORT}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

          echo "Tags geradas:"
          echo "  ${IMAGE}:latest"
          echo "  ${IMAGE}:${VERSION_TAG}"

      - name: Login no Magalu Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CR_ENDPOINT }}
          username: ${{ secrets.MAGALU_CR_USER }}
          password: ${{ secrets.MAGALU_CR_PASSWORD }}

      - name: Build da imagem
        run: |
          docker build \
            -t ${{ steps.tags.outputs.image }}:latest \
            -t ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version_tag }} \
            .

      - name: Push da imagem
        run: |
          docker push ${{ steps.tags.outputs.image }}:latest
          docker push ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version_tag }}

      - name: Resumo
        run: |
          {
            echo "### Imagem publicada :rocket:"
            echo ""
            echo "- \`${{ steps.tags.outputs.image }}:latest\`"
            echo "- \`${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"